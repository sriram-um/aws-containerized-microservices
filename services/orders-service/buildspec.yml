# Exercise 12: orders pipeline, Build stage - test, build and push the Orders Service image.
# REPOSITORY_URI comes from the CodeBuild project (template.yaml).
version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet -r services/orders-service/requirements-dev.txt
  pre_build:
    on-failure: ABORT
    commands:
      - python -m pytest -q services/orders-service/tests
      - TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}
      - IMAGE_URI=$REPOSITORY_URI:$TAG
      - aws ecr get-login-password | docker login --username AWS --password-stdin ${REPOSITORY_URI%%/*}
  build:
    on-failure: ABORT
    commands:
      # Tags are immutable: a re-run for the same commit reuses the image that is already in ECR
      - |
        if aws ecr describe-images --repository-name ${REPOSITORY_URI##*/} --image-ids imageTag=$TAG >/dev/null 2>&1; then
          echo "Image $TAG already in ECR - skipping docker build"
        else
          docker build -t $IMAGE_URI services/orders-service
          docker push $IMAGE_URI
        fi
  post_build:
    on-failure: ABORT
    commands:
      - printf 'IMAGE_URI=%s\nTAG=%s\n' "$IMAGE_URI" "$TAG" > image.env
      - cat image.env

artifacts:
  # Everything the Deploy stage needs: it runs on this artifact, not on the source - including its
  # own buildspec (the first run failed with "deployspec.yml: no such file or directory")
  files:
    - image.env
    - scripts/render_taskdef.py
    - services/orders-service/deployspec.yml
