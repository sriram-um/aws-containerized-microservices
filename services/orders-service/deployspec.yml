# Exercise 12: orders pipeline, Deploy stage - ECS rolling deployment (no CodeDeploy).
# Takes the task definition CloudFormation registered (TASK_DEFINITION_ARN: roles, sidecar, env),
# swaps in the new image, registers it and updates the service. The ECS deployment circuit breaker
# rolls back automatically if the new tasks don't become healthy.
version: 0.2

env:
  shell: bash

phases:
  build:
    on-failure: ABORT
    commands:
      - source image.env
      - aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_ARN" --query taskDefinition > td.json
      - python scripts/render_taskdef.py td.json "$TAG" orders-service "$IMAGE_URI" > taskdef.json
      - NEW_TD=$(aws ecs register-task-definition --cli-input-json file://taskdef.json --query taskDefinition.taskDefinitionArn --output text)
      - echo "registered $NEW_TD"
      - aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_TD" --query 'service.deployments[0].id' --output text
      # Wait for the deployment's rolloutState (not `wait services-stable`: it returns as soon as the
      # task counts match, while the rollout is still IN_PROGRESS until the old tasks have drained).
      # FAILED = the circuit breaker stopped it and rolled back to the previous revision.
      - |
        for i in $(seq 1 90); do
          STATE=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query "services[0].deployments[?taskDefinition=='$NEW_TD'].rolloutState|[0]" --output text)
          [ "$STATE" = "COMPLETED" ] || [ "$STATE" = "FAILED" ] && break
          sleep 10
        done
        RUNNING_TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
        echo "rolloutState=$STATE running=$RUNNING_TD after $((i * 10)) s"
        [ "$STATE" = "COMPLETED" ] && [ "$RUNNING_TD" = "$NEW_TD" ]
