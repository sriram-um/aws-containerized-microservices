AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Containerized microservices on Amazon ECS - Product Service (GET /products from PostgreSQL).
  One stack, extended exercise by exercise.

Parameters:
  EnableCompute:
    Description: Hourly-billed pieces (VPC interface endpoints, ALB, Fargate service). Off between demos.
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableDatabase:
    Description: RDS PostgreSQL instance (hourly billed). Off between demos.
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  # (Exercises 3-8 had a NoEcho DBPassword parameter here; exercise 9 replaced it with the
  # generated Secrets Manager secret DatabaseSecret.)
  ProductServiceImageTag:
    Description: Image tag (git SHA) in the product-service ECR repository
    Type: String
    Default: dcac7a8
  AdotCollectorVersion:
    Description: AWS Distro for OpenTelemetry collector image tag (public.ecr.aws, pulled through the ECR cache)
    Type: String
    Default: v0.51.0
  TraceSampleRatio:
    Description: Share of requests traced to X-Ray (0.0-1.0)
    Type: String
    Default: '0.1'
  GitHubRepository:
    Description: owner/repo the pipeline builds from
    Type: String
    Default: sriram-um/aws-containerized-microservices
  GitHubBranch:
    Type: String
    Default: main
  TestTrafficCidr:
    Description: Who may call the blue/green test listener (:8080). Default allows nobody.
    Type: String
    Default: 127.0.0.1/32

Conditions:
  ComputeEnabled: !Equals [!Ref EnableCompute, 'true']
  DatabaseEnabled: !Equals [!Ref EnableDatabase, 'true']

Mappings:
  Network:
    Vpc: { Cidr: 10.50.0.0/16 }
    PublicA: { Cidr: 10.50.0.0/24 }
    PublicB: { Cidr: 10.50.1.0/24 }
    PrivateA: { Cidr: 10.50.10.0/24 }
    PrivateB: { Cidr: 10.50.11.0/24 }
    DatabaseA: { Cidr: 10.50.20.0/24 }
    DatabaseB: { Cidr: 10.50.21.0/24 }

Resources:
  # ---------------------------------------------------------------------------
  # Exercise 2: Amazon ECR repository for the Product Service image
  # ---------------------------------------------------------------------------
  ProductServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: product-service
      # Images are tagged with the git SHA; immutable tags guarantee a tag always means the same image
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Lets the stack (and the end-of-project teardown) delete the repository with images in it
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep the 10 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: project
          Value: containerized-microservices

  # ---------------------------------------------------------------------------
  # Exercise 3: Networking - VPC with public (ALB, exercise 4), private (ECS) and
  # database subnets in 2 AZs. No NAT gateway: private subnets reach AWS services
  # only through VPC endpoints.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Network, Vpc, Cidr]
      EnableDnsSupport: true
      EnableDnsHostnames: true   # required for interface endpoint private DNS
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-vpc' }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-igw' }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !FindInMap [Network, PublicA, Cidr]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-public-a' }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !FindInMap [Network, PublicB, Cidr]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-public-b' }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !FindInMap [Network, PrivateA, Cidr]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-private-a' }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !FindInMap [Network, PrivateB, Cidr]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-private-b' }

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !FindInMap [Network, DatabaseA, Cidr]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-database-a' }

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !FindInMap [Network, DatabaseB, Cidr]
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-database-b' }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-public' }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private and database subnets: local VPC routes only (+ the S3 gateway endpoint route)
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-private' }

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  DatabaseSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnetA
      RouteTableId: !Ref PrivateRouteTable

  DatabaseSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Security groups ----------------------------------------------------------
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Product Service tasks (awsvpc ENIs). Ingress from the ALB is added in exercise 4.
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-app' }

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints - HTTPS from tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Tasks (Fargate pulls images and ships logs through the task ENI)
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-endpoints' }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL - only from Product Service tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Product Service tasks
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-database' }

  # VPC endpoints -------------------------------------------------------------
  # S3 gateway endpoint (free): ECR stores image layers in S3; AL2023 package repos are on S3 too
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # Interface endpoints (~$0.01/h per endpoint per AZ) - only while compute is enabled
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ComputeEnabled
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ComputeEnabled
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ComputeEnabled
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # ---------------------------------------------------------------------------
  # Exercise 3: Amazon RDS for PostgreSQL
  # ---------------------------------------------------------------------------
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Database subnets for the Product Service
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]

  # Exercises 3-9: RDS for PostgreSQL db.t4g.micro instance `Database` - replaced by the Aurora
  # Global Database below in exercise 10 (removed after the app moved to Aurora).

  # ---------------------------------------------------------------------------
  # Exercise 10: Amazon Aurora PostgreSQL Global Database (primary in us-east-1)
  # The secondary cluster (us-west-2) is a separate stack: infra/aurora-secondary.yaml.
  # Serverless v2 0.5-2 ACU per Region (demo sizing; AWS recommends >= 8 ACU on the primary of a
  # busy global database). Burstable db.t* classes aren't supported for global databases.
  # ---------------------------------------------------------------------------
  GlobalDatabase:
    Type: AWS::RDS::GlobalCluster
    Condition: DatabaseEnabled
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      GlobalClusterIdentifier: !Sub '${AWS::StackName}-global'
      Engine: aurora-postgresql
      EngineVersion: '16.15'
      StorageEncrypted: true
      DeletionProtection: false

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Condition: DatabaseEnabled
    DeletionPolicy: Delete       # demo data, re-created by the seed task
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub '${AWS::StackName}-aurora-use1'
      GlobalClusterIdentifier: !Ref GlobalDatabase
      Engine: aurora-postgresql
      EngineVersion: '16.15'
      DatabaseName: products
      MasterUsername: productadmin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      StorageEncrypted: true      # AWS-managed key aws/rds
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags:
        - Key: project
          Value: containerized-microservices

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Condition: DatabaseEnabled
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-aurora-use1-1'
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - Key: project
          Value: containerized-microservices

  # ---------------------------------------------------------------------------
  # Exercise 3: Amazon ECS cluster (EC2 capacity provider in exercises 3-6; Fargate since exercise 7)
  # ---------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName
      # Exercise 5: Container Insights (task/service metrics such as DesiredTaskCount, RunningTaskCount)
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: project
          Value: containerized-microservices

  ClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Condition: ComputeEnabled
    Properties:
      Cluster: !Ref Cluster
      # Exercise 7: Fargate only (the EC2 capacity provider and its Auto Scaling group were removed).
      # The default strategy also applies to CodeDeploy task sets and run-task.
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # Task IAM roles ---------------------------------------------------------------
  # Execution role: used by the ECS agent to pull the image and ship logs (not by the app)
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pull-image-and-write-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken   # account-level action, no resource scoping
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource:
                  - !GetAtt ProductServiceRepository.Arn
                  # Exercise 5: ADOT collector via the pull-through cache. The first pull creates the
                  # cache repository and imports the image, which needs the two extra actions.
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/ecr-public/aws-observability/*
              - Effect: Allow
                Action: [ecr:CreateRepository, ecr:BatchImportUpstreamImage]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/ecr-public/aws-observability/*
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ProductServiceLogGroup.Arn
              # Exercise 9: read this one secret at task start (AWS-managed key aws/secretsmanager,
              # so no kms:Decrypt statement is needed). The application's task role gets no access.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret

  # Task role: AWS permissions for the containers themselves (exercise 5: the ADOT collector sends traces)
  ProductServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: xray-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                # Same actions as the AWS-managed AWSXRayDaemonWriteAccess; X-Ray doesn't support resource scoping
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                  - xray:GetSamplingStatisticSummaries
                Resource: '*'

  ProductServiceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete       # 14-day demo logs; removed with the stack
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}/product-service
      RetentionInDays: 14

  # Task definition: one container; the seed job runs the same image with a command override
  ProductServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: product-service
      # Exercise 7: Fargate only (EC2 + FARGATE while both services overlapped). awsvpc, task-level
      # CPU/memory and ARM64 were already valid for Fargate.
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc            # each task gets its own ENI and security group
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ProductServiceTaskRole.Arn
      ContainerDefinitions:
        - Name: product-service
          Image: !Sub '${ProductServiceRepository.RepositoryUri}:${ProductServiceImageTag}'
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            # Exercise 10: the app only reads, so it uses the Aurora cluster's READER endpoint. It works
            # whether this cluster is the global primary or (after a switchover) a secondary; writes
            # (seed) use the writer endpoint (scripts/run_task.sh).
            - Name: DB_HOST
              Value: !If [DatabaseEnabled, !GetAtt AuroraCluster.ReadEndpoint.Address, 'database-disabled']
            - { Name: DB_PORT, Value: '5432' }
            - { Name: DB_NAME, Value: products }
            - { Name: DB_SSLMODE, Value: require }
            - { Name: APP_VERSION, Value: !Ref ProductServiceImageTag }
            # Exercise 5: OpenTelemetry -> ADOT sidecar (same network namespace in awsvpc)
            - { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: 'http://127.0.0.1:4318' }
            - { Name: TRACE_SAMPLE_RATIO, Value: !Ref TraceSampleRatio }
          # Exercise 9: credentials from Secrets Manager. The ECS agent (execution role) reads the
          # secret when the task starts and injects the values as environment variables; the task
          # definition only contains the secret ARN + JSON key, never the value.
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub '${DatabaseSecret}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${DatabaseSecret}:password::'
          DependsOn:
            - ContainerName: aws-otel-collector
              Condition: START
          # ECS ignores the Dockerfile HEALTHCHECK; this is the same check
          HealthCheck:
            Command:
              - CMD
              - python
              - -c
              - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          StopTimeout: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProductServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: product-service
        # Exercise 5: ADOT collector sidecar - receives OTLP from the app, exports to X-Ray.
        # Not essential: if it fails, the API keeps serving (only traces are lost).
        - Name: aws-otel-collector
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ecr-public/aws-observability/aws-otel-collector:${AdotCollectorVersion}'
          Essential: false
          Cpu: 64
          Memory: 128
          MemoryReservation: 64
          Command: ['--config=env:AOT_CONFIG_CONTENT']
          Environment:
            - Name: AOT_CONFIG_CONTENT
              Value: !Sub |
                extensions:
                  health_check:
                    endpoint: 127.0.0.1:13133
                receivers:
                  otlp:
                    protocols:
                      http:
                        endpoint: 127.0.0.1:4318
                processors:
                  batch/traces:
                    timeout: 1s
                    send_batch_size: 50
                exporters:
                  awsxray:
                    region: ${AWS::Region}
                service:
                  extensions: [health_check]
                  pipelines:
                    traces:
                      receivers: [otlp]
                      processors: [batch/traces]
                      exporters: [awsxray]
          HealthCheck:
            Command: [CMD, /healthcheck]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProductServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: product-service

  # Exercise 5: ECR pull-through cache for ECR Public. Tasks in the private subnets can't reach
  # public.ecr.aws; the cache serves the image through the private ECR endpoints instead.
  EcrPublicPullThroughCache:
    Type: AWS::ECR::PullThroughCacheRule
    Properties:
      EcrRepositoryPrefix: ecr-public
      UpstreamRegistryUrl: public.ecr.aws

  # ---------------------------------------------------------------------------
  # Exercise 9: database credentials in AWS Secrets Manager
  # ---------------------------------------------------------------------------
  # Migration in 2 deploys: first the secret held the CURRENT password (tasks moved to the secret,
  # RDS unchanged), then it was switched to a generated password that RDS reads via {{resolve:}}.
  # No rotation: the project is torn down at the end (README, Phase 9).
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/database'
      Description: Product Service RDS PostgreSQL master credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username": "productadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        # Not allowed in RDS master passwords: / @ " and space; ' and \ excluded for safe conninfo strings
        ExcludeCharacters: "/@\"' \\"
      Tags:
        - Key: project
          Value: containerized-microservices

  # Tasks in the private subnets reach Secrets Manager through this endpoint (~$0.02/h for 2 AZs)
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ComputeEnabled
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  XRayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ComputeEnabled
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.xray
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # ---------------------------------------------------------------------------
  # Exercise 4: ECS Service behind an Application Load Balancer, with Auto Scaling
  # ---------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB - HTTP from the internet, forwards only to the Product Service tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from the internet
      Tags:
        - { Key: Name, Value: !Sub '${AWS::StackName}-alb' }

  # Separate rule resources avoid a circular reference between the two security groups
  AlbToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !Ref AppSecurityGroup
      Description: To Product Service tasks

  AppFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: From the ALB (traffic + health checks)

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: ComputeEnabled
    DependsOn: PublicDefaultRoute
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      Tags:
        - Key: project
          Value: containerized-microservices

  ProductServiceTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: ComputeEnabled
    Properties:
      # No Name: target group names are limited to 32 characters, and a generated name lets
      # CloudFormation replace the target group if a property change requires it
      VpcId: !Ref Vpc
      TargetType: ip                # awsvpc: the ALB targets each task's ENI
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        # Default is 300 s; the API has no long requests, so in-flight requests drain in seconds
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: ComputeEnabled
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProductServiceTargetGroup

  # Exercises 4-6: the EC2 service `product-service` (and its scalable target and policy) was
  # removed in exercise 7 after the Fargate service `product-api` took over its traffic.

  # ---------------------------------------------------------------------------
  # Exercise 7: Product Service on AWS Fargate
  # ---------------------------------------------------------------------------
  # With the CODE_DEPLOY controller, UpdateService can't change the capacity provider strategy,
  # so Fargate needs a NEW service. It registers in the target group that currently receives
  # production traffic (CodeDeploy last switched :80 to target group 2), so EC2 and Fargate tasks
  # serve side by side until the EC2 service is removed - no downtime.
  ProductApiService:
    Type: AWS::ECS::Service
    Condition: ComputeEnabled
    DependsOn: [HttpListener, ClusterCapacityProviders, EcrPublicPullThroughCache, XRayEndpoint,
                ProductServiceTaskDefinition]
    Properties:
      ServiceName: product-api
      Cluster: !Ref Cluster
      TaskDefinition: product-service   # family name: CloudFormation never updates it (exercise 6)
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      PlatformVersion: LATEST
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: product-service
          ContainerPort: 3000
          TargetGroupArn: !Ref ProductServiceTargetGroupGreen
      HealthCheckGracePeriodSeconds: 30
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: project
          Value: containerized-microservices

  ProductApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: ComputeEnabled
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${ProductApiService.Name}
      MinCapacity: 2
      MaxCapacity: 6

  ProductApiCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ComputeEnabled
    Properties:
      PolicyName: !Sub '${AWS::StackName}-product-api-cpu60'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ProductApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 120

  # ---------------------------------------------------------------------------
  # Exercise 8: Fargate Spot. The strategy (FARGATE base 1 + FARGATE_SPOT weight 3) lives in
  # appspec.yaml: the CODE_DEPLOY service can't change its own strategy, but each deployment's
  # task set takes the one from the AppSpec. Here: make Spot interruptions visible.
  # ---------------------------------------------------------------------------
  SpotInterruptionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # EventBridge -> CloudWatch Logs targets must be named /aws/events/... (Project 4 lesson)
      LogGroupName: !Sub /aws/events/${AWS::StackName}/spot-interruptions
      RetentionInDays: 14

  SpotInterruptionLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-spot-events-to-logs'
      # Allows EventBridge to write to this log group only (the console adds this silently; CFN doesn't)
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"]},
            "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
            "Resource": "${SpotInterruptionLogGroup.Arn}"
          }]
        }

  SpotInterruptionRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-spot-interruptions'
      Description: Fargate Spot interruptions of tasks in this cluster (2-minute warning) to CloudWatch Logs
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt Cluster.Arn]
          stopCode: [SpotInterruption]
      Targets:
        - Id: spot-interruptions-log
          Arn: !GetAtt SpotInterruptionLogGroup.Arn

  # ---------------------------------------------------------------------------
  # Exercise 6: CI/CD - CodePipeline (GitHub) -> CodeBuild -> CodeDeploy ECS blue/green
  # ---------------------------------------------------------------------------
  # Blue/green needs a second target group and a test listener. CodeDeploy swaps the listeners'
  # target groups on every deployment, so HttpListener/TestListener must not be edited in this
  # template afterwards (a stack update would point them back at the original target groups).
  ProductServiceTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: ComputeEnabled
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  AlbTestListenerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp: !Ref TestTrafficCidr
      Description: Blue/green test listener

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: ComputeEnabled
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProductServiceTargetGroupGreen

  # GitHub connection: created PENDING; the handshake is completed once in the console
  # (Developer Tools > Settings > Connections). Kept outside the toggle so it never needs re-authorizing.
  # The handshake must use an "AWS Connector for GitHub" installation on the account that OWNS the
  # repository (sriram-um). The first connection was linked to an installation on another account:
  # source downloads worked (public repo) but push events never arrived. Renamed = new connection.
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Properties:
      ConnectionName: containerized-ms-github   # max 32 characters
      ProviderType: GitHub

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete     # must be emptied before stack deletion (teardown script)
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-pipeline-artifacts
            Status: Enabled
            ExpirationInDays: 14
      Tags:
        - Key: project
          Value: containerized-microservices

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # CodeBuild -----------------------------------------------------------------
  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${AWS::StackName}-product-service
      RetentionInDays: 14

  CodeBuildRole:
    Type: AWS::IAM::Role
    Condition: ComputeEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: build-and-push-product-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${CodeBuildLogGroup.Arn}'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken   # account-level action
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !GetAtt ProductServiceRepository.Arn
              - Effect: Allow
                Action: ecs:DescribeTaskDefinition   # no resource-level permissions for this action
                Resource: '*'

  ProductServiceBuild:
    Type: AWS::CodeBuild::Project
    Condition: ComputeEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-product-service'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        # Native arm64 build host (a local arm64 build under QEMU takes ~6 min)
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true     # docker build
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !GetAtt ProductServiceRepository.RepositoryUri
          - Name: TASK_DEFINITION_ARN
            Value: !Ref ProductServiceTaskDefinition
      Cache:
        Type: LOCAL
        Modes: [LOCAL_DOCKER_LAYER_CACHE, LOCAL_SOURCE_CACHE]
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup
      TimeoutInMinutes: 20
      Tags:
        - Key: project
          Value: containerized-microservices

  # CodeDeploy ----------------------------------------------------------------
  CodeDeployRole:
    Type: AWS::IAM::Role
    Condition: ComputeEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: sts:AssumeRole
      # AWS-managed policy for ECS blue/green: task sets, ELB listener/rule changes, alarms
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Condition: ComputeEnabled
    Properties:
      ApplicationName: !Sub '${AWS::StackName}-product-service'
      ComputePlatform: ECS

  # Alarms that stop and roll back a deployment (both target groups: either can be "green")
  UnhealthyTargetsBlueAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ComputeEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-unhealthy-targets-tg1'
      AlarmDescription: Unhealthy Product Service targets in target group 1 (rolls back CodeDeploy)
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt ProductServiceTargetGroup.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  UnhealthyTargetsGreenAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ComputeEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-unhealthy-targets-tg2'
      AlarmDescription: Unhealthy Product Service targets in target group 2 (rolls back CodeDeploy)
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt ProductServiceTargetGroupGreen.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ComputeEnabled
    Properties:
      AlarmName: !Sub '${AWS::StackName}-target-5xx'
      AlarmDescription: Product Service returns 5xx (rolls back CodeDeploy)
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Exercise 7: deployment group for the Fargate service (replaced the one for `product-service`)
  ProductApiDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Condition: ComputeEnabled
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: product-api
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      # Canary: 10 % of traffic for 5 min, then the rest. With all-at-once, a broken (but healthy)
      # release served 100 % of requests for 3.5 min until the 5xx alarm fired (README, Phase 6).
      DeploymentConfigName: CodeDeployDefault.ECSCanary10Percent5Minutes
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT   # shift traffic as soon as the green tasks are healthy
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5        # blue tasks kept 5 min for an instant rollback
      ECSServices:
        - ClusterName: !Ref Cluster
          ServiceName: !GetAtt ProductApiService.Name
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !GetAtt ProductServiceTargetGroup.TargetGroupName
              - Name: !GetAtt ProductServiceTargetGroupGreen.TargetGroupName
            ProdTrafficRoute:
              ListenerArns: [!Ref HttpListener]
            TestTrafficRoute:
              ListenerArns: [!Ref TestListener]
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_ALARM, DEPLOYMENT_STOP_ON_REQUEST]
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref UnhealthyTargetsBlueAlarm
          - Name: !Ref UnhealthyTargetsGreenAlarm
          - Name: !Ref Target5xxAlarm

  # CodePipeline --------------------------------------------------------------
  PipelineRole:
    Type: AWS::IAM::Role
    Condition: ComputeEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: product-service-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [codeconnections:UseConnection, codestar-connections:UseConnection]
                Resource: !Ref GitHubConnection
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt ProductServiceBuild.Arn
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/product-api
              - Effect: Allow
                Action: codedeploy:GetDeploymentConfig
                Resource: !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*
              - Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:TagResource]   # no resource-level scoping for register
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt ProductServiceTaskRole.Arn]
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Condition: ComputeEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-product-service'
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      # Only changes to the service (or the build/deploy files) start the pipeline - README edits don't
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches:
                  Includes: [!Ref GitHubBranch]
                FilePaths:
                  Includes:
                    - services/product-service/**
                    - buildspec.yml
                    - appspec.yaml
                    - scripts/render_taskdef.py
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1' }
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts: [{ Name: SourceOutput }]
        - Name: Build
          Actions:
            - Name: TestBuildPush
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref ProductServiceBuild
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: BuildOutput }]
        - Name: Deploy
          Actions:
            - Name: BlueGreen
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeployToECS, Version: '1' }
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref ProductApiDeploymentGroup
                TaskDefinitionTemplateArtifact: BuildOutput
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: BuildOutput
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: BuildOutput
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts: [{ Name: BuildOutput }]
      Tags:
        - Key: project
          Value: containerized-microservices

  # ---------------------------------------------------------------------------
  # Exercise 5: CloudWatch dashboard (~$3/month). Sparse ALB error counts are wrapped in
  # FILL(m, 0) so idle periods show 0 instead of a gap or a straight line.
  # ---------------------------------------------------------------------------
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: ComputeEnabled
    Properties:
      DashboardName: !Sub '${AWS::StackName}-dashboard'
      DashboardBody: !Sub
        - |
          {
            "start": "-PT3H",
            "widgets": [
              {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "ECS cluster - CPU reserved vs used (units), memory reserved vs used (MiB)", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Average", "period": 60, "yAxis": {"left": {"min": 0}, "right": {"min": 0}},
                "metrics": [
                  ["ECS/ContainerInsights", "CpuReserved", "ClusterName", "${Cluster}", {"label": "CpuReserved"}],
                  [".", "CpuUtilized", ".", ".", {"label": "CpuUtilized"}],
                  [".", "MemoryReserved", ".", ".", {"label": "MemoryReserved (MiB)", "yAxis": "right"}],
                  [".", "MemoryUtilized", ".", ".", {"label": "MemoryUtilized (MiB)", "yAxis": "right"}]
                ]}},
              {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Service tasks - desired / running / pending", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Average", "period": 60, "yAxis": {"left": {"min": 0}},
                "metrics": [
                  ["ECS/ContainerInsights", "DesiredTaskCount", "ClusterName", "${Cluster}", "ServiceName", "${ServiceName}", {"label": "DesiredTaskCount"}],
                  [".", "RunningTaskCount", ".", ".", ".", ".", {"label": "RunningTaskCount"}],
                  [".", "PendingTaskCount", ".", ".", ".", ".", {"label": "PendingTaskCount"}]
                ]}},
              {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Service CPU / memory utilization (%) - scaling target 60 %", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Average", "period": 60, "yAxis": {"left": {"min": 0}},
                "annotations": {"horizontal": [{"label": "CPU target", "value": 60}]},
                "metrics": [
                  ["AWS/ECS", "CPUUtilization", "ClusterName", "${Cluster}", "ServiceName", "${ServiceName}", {"label": "CPUUtilization"}],
                  [".", "MemoryUtilization", ".", ".", ".", ".", {"label": "MemoryUtilization"}]
                ]}},
              {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "ALB - requests and errors (per minute)", "region": "${AWS::Region}",
                "view": "timeSeries", "period": 60, "yAxis": {"left": {"min": 0}},
                "metrics": [
                  ["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${AlbName}", {"stat": "Sum", "label": "RequestCount"}],
                  [{"expression": "FILL(m4xx, 0)", "label": "HTTPCode_Target_4XX_Count", "id": "e4xx"}],
                  [{"expression": "FILL(m5xx, 0)", "label": "HTTPCode_Target_5XX_Count", "id": "e5xx"}],
                  [{"expression": "FILL(melb5xx, 0)", "label": "HTTPCode_ELB_5XX_Count", "id": "eelb5xx"}],
                  ["AWS/ApplicationELB", "HTTPCode_Target_4XX_Count", "LoadBalancer", "${AlbName}", {"stat": "Sum", "id": "m4xx", "visible": false}],
                  [".", "HTTPCode_Target_5XX_Count", ".", ".", {"stat": "Sum", "id": "m5xx", "visible": false}],
                  [".", "HTTPCode_ELB_5XX_Count", ".", ".", {"stat": "Sum", "id": "melb5xx", "visible": false}]
                ]}},
              {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "ALB - target response time (seconds)", "region": "${AWS::Region}",
                "view": "timeSeries", "period": 60, "yAxis": {"left": {"min": 0}},
                "metrics": [
                  ["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AlbName}", {"stat": "p50", "label": "p50"}],
                  ["...", {"stat": "p90", "label": "p90"}],
                  ["...", {"stat": "p99", "label": "p99"}]
                ]}},
              {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "Targets - healthy / unhealthy in both blue/green target groups", "region": "${AWS::Region}",
                "view": "timeSeries", "period": 60, "stat": "Average", "yAxis": {"left": {"min": 0}},
                "metrics": [
                  ["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroup1}", "LoadBalancer", "${AlbName}", {"label": "Healthy - target group 1"}],
                  [".", ".", ".", "${TargetGroup2}", ".", ".", {"label": "Healthy - target group 2"}],
                  [".", "UnHealthyHostCount", ".", "${TargetGroup1}", ".", ".", {"label": "Unhealthy - target group 1"}],
                  [".", ".", ".", "${TargetGroup2}", ".", ".", {"label": "Unhealthy - target group 2"}]
                ]}},
              {"type": "metric", "x": 0, "y": 12, "width": 8, "height": 6, "properties": {
                "title": "Aurora primary (us-east-1) - capacity (ACU) and connections", "region": "${AWS::Region}",
                "view": "timeSeries", "stat": "Average", "period": 60, "yAxis": {"left": {"min": 0}, "right": {"min": 0}},
                "metrics": [
                  ["AWS/RDS", "ServerlessDatabaseCapacity", "DBClusterIdentifier", "${AWS::StackName}-aurora-use1", {"label": "ServerlessDatabaseCapacity (ACU)"}],
                  [".", "DatabaseConnections", ".", ".", {"label": "DatabaseConnections", "yAxis": "right"}]
                ]}},
              {"type": "metric", "x": 8, "y": 12, "width": 8, "height": 6, "properties": {
                "title": "Aurora Global Database - replication lag to us-west-2 (ms)", "region": "us-west-2",
                "view": "timeSeries", "period": 60, "yAxis": {"left": {"min": 0}},
                "metrics": [
                  ["AWS/RDS", "AuroraGlobalDBReplicationLag", "DBClusterIdentifier", "${AWS::StackName}-aurora-usw2", "SourceRegion", "${AWS::Region}", {"stat": "Average", "label": "ReplicationLag avg"}],
                  ["...", {"stat": "Maximum", "label": "ReplicationLag max"}],
                  [".", "AuroraGlobalDBRPOLag", ".", ".", ".", ".", {"stat": "Maximum", "label": "RPOLag max"}]
                ]}},
              {"type": "text", "x": 16, "y": 12, "width": 8, "height": 6, "properties": {
                "markdown": "## Product Service (ECS on Fargate, service product-api)\n* **Deployments:** CodePipeline + CodeDeploy blue/green, canary 10 % / 5 min\n* **Traces:** X-Ray via the ADOT collector sidecar, sampling ${TraceSampleRatio}. This account uses CloudWatch Transaction Search: spans are in the log group `aws/spans`.\n* **Logs:** `/ecs/${AWS::StackName}/product-service`\n* **Scaling:** CPU target 60 %, 2-6 Fargate tasks (0.25 vCPU / 0.5 GB, ARM64)\n* **Database:** Aurora PostgreSQL Global Database (us-east-1 primary, us-west-2 secondary); app reads via the reader endpoint. Aurora widgets are empty while `EnableDatabase=false`."
              }}
            ]
          }
        - ServiceName: !GetAtt ProductApiService.Name
          AlbName: !GetAtt LoadBalancer.LoadBalancerFullName
          TargetGroup1: !GetAtt ProductServiceTargetGroup.TargetGroupFullName
          TargetGroup2: !GetAtt ProductServiceTargetGroupGreen.TargetGroupFullName

  # ---------------------------------------------------------------------------
  # Exercise 12 (real-world project): Project 3's orders API as a second ECS service.
  # Data: DynamoDB (as in Project 3). Identity: Cognito user pool; the service verifies the ID
  # token itself (Project 3 used API Gateway's Cognito authorizer).
  # ---------------------------------------------------------------------------
  OrdersServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: orders-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "Keep the 10 most recent images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}
      Tags:
        - Key: project
          Value: containerized-microservices

  # Same key schema as Project 3: one item per order line
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete       # test orders only
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${AWS::StackName}-orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: orderId, AttributeType: S }
        - { AttributeName: itemId, AttributeType: S }
      KeySchema:
        - { AttributeName: orderId, KeyType: HASH }
        - { AttributeName: itemId, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true          # AWS-managed key aws/dynamodb
      Tags:
        - Key: project
          Value: containerized-microservices

  # Lite plan: no per-MAU charge within 10 000 MAU. No domain: user pools with a domain can't be
  # used through the cognito-idp VPC endpoint (and no hosted UI is needed - CLI/API sign-in only).
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # no public self sign-up (as in Project 3)
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolTags:
        project: containerized-microservices

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: orders-cli
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes }

  # Free gateway endpoint: DynamoDB from the private subnets without NAT
  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # The orders service fetches the user pool's signing keys (JWKS) through this endpoint.
  # Only in private subnet B: the cognito-idp endpoint service isn't offered in us-east-1a (use1-az1)
  # in this account ("does not support the availability zone"). Tasks in 1a use it across AZs.
  CognitoIdpEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ComputeEnabled
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.cognito-idp
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

Outputs:
  OrdersServiceRepositoryUri:
    Value: !GetAtt OrdersServiceRepository.RepositoryUri
  OrdersTableName:
    Value: !Ref OrdersTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ProductServiceRepositoryUri:
    Description: Image URI prefix for docker tag/push
    Value: !GetAtt ProductServiceRepository.RepositoryUri
  ProductServiceRepositoryArn:
    Value: !GetAtt ProductServiceRepository.Arn
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  ClusterName:
    Value: !Ref Cluster
  CapacityProviderName:
    Value: FARGATE
  TaskDefinitionArn:
    Value: !Ref ProductServiceTaskDefinition
  LogGroupName:
    Value: !Ref ProductServiceLogGroup
  GlobalClusterIdentifier:
    Condition: DatabaseEnabled
    Value: !Ref GlobalDatabase
  AuroraClusterIdentifier:
    Condition: DatabaseEnabled
    Value: !Ref AuroraCluster
  AuroraWriterEndpoint:
    Condition: DatabaseEnabled
    Value: !GetAtt AuroraCluster.Endpoint.Address
  AuroraReaderEndpoint:
    Condition: DatabaseEnabled
    Value: !GetAtt AuroraCluster.ReadEndpoint.Address
  ProductsUrl:
    Condition: ComputeEnabled
    Value: !Sub 'http://${LoadBalancer.DNSName}/products'
  ServiceName:
    Condition: ComputeEnabled
    Value: !GetAtt ProductApiService.Name
  LoadBalancerFullName:
    Condition: ComputeEnabled
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
  TargetGroupFullName:
    Condition: ComputeEnabled
    Value: !GetAtt ProductServiceTargetGroup.TargetGroupFullName
  GitHubConnectionArn:
    Value: !Ref GitHubConnection
  PipelineName:
    Condition: ComputeEnabled
    Value: !Ref Pipeline
  CodeDeployApplicationName:
    Condition: ComputeEnabled
    Value: !Ref CodeDeployApplication
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  DashboardUrl:
    Condition: ComputeEnabled
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AWS::StackName}-dashboard'
